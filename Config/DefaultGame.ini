[/Script/LoomaSceneSync.LoomaSceneSyncSubsystem]
; Use an explicit IPv4 address, never "localhost": UE's WebSocket client may resolve
; localhost to IPv6 (::1) while uvicorn listens on IPv4 only, which shows up as
; endless "connect failed (retrying)" in the Output Log. Swap in the backend
; machine's LAN IP when the backend is not on this machine.
BackendHost=127.0.0.1:8000
; Trim for the difference between UE's and three.js's exposure, not between their
; light units — those already match 1:1. See the plugin README.
LightIntensityScale=1.0
; Stand a `model`'s GLB on the node origin, as the web client does. False centres it
; instead (the pre-v3 Unreal behaviour), which reads as half-buried at floor level.
bBaseAlignModels=True
; Prefix a *web* peer needs in front of /static/... — the Vite proxy path, i.e. the
; backend's LOOMA_PUBLIC_API_PREFIX. Only used to fill in the `url` of a `model` we
; spawn: the browser renders nothing without one and the hub will not invent it.
WebAssetPrefix=/api
